[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmj-recovery-dynamics"
version = "1.0.0"
description = "Typed scientific contracts for CMJ recovery forecasting benchmarks"
readme = "README.rst"
authors = [{name = "Julio Rodriguez"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
inference = ["torch>=2.6"]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
