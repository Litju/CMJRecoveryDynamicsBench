   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(60.867925 73.857873)">1  Preserve</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(53.031206 81.337482)">source, configs,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(67.157534 89.185686)">outputs</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(190.728127 73.965607)">2  Authenticate</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(188.077971 81.337482)">identities, rights,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(189.441877 89.387482)">repeat selection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(337.129658 73.903811)">3  Restore</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(324.332236 81.658498)">fitted transforms,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(322.732627 89.387482)">input row contract</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(334.533642 159.038166)">4  Compare</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(328.894268 167.149962)">original-source</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(335.632861 175.138166)">CPU arrays</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(197.365002 159.038166)">5  Compare</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(190.185627 167.828087)">saved historical</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(195.546643 175.138166)">CUDA arrays</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(63.768003 159.099962)">6  Qualify</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(50.633159 167.828087)">record result and</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(65.723081 175.878087)">its limits</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(55.822968 281.795247)">Native mechanics</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(58.23414 289.845247)">contract defined</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #18232d" transform="translate(194.70425 281.117122)">Synthetic study</text>
