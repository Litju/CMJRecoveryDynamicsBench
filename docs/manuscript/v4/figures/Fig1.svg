   <g id="text_8">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(29.465976 62.307574)">CMJ force–time:</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(24.750125 69.659527)">mean force (N/kg),</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(26.411804 77.034527)">net impulse (m/s)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(127.628439 62.284527)">training exposure,</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(124.991416 69.930098)">baseline, time since</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(140.931556 76.444988)">exposure</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(232.405816 62.624238)">fixed 24 h / 84 h</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(225.265433 70.23109)">mathematical modes</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(222.556503 77.034527)">(synthetic assumption)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(336.64574 62.114441)">one generator:</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(332.98313 69.659527)">camps, episodes,</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(337.374482 77.60609)">three horizons</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(436.081773 62.85609)">baseline-relative</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(439.623156 70.23109)">innovations at</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(436.97507 77.322152)">H24 / H48 / H72</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(73.196711 152.482397)">Original neural architectures M0–M8</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(75.666555 159.982397)">9 families × 2 repeats = 18 routes</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(58.68843 167.482397)">structure, inputs, parameter counts, CPU/GPU</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(93.211868 174.982397)">numerical qualification</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(58.31718 182.482397)">NO public predictive-performance comparison</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(340.837947 152.482397)">Public synthetic experiment</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(311.592634 160.257553)">4 evaluated reference models: zero innovation,</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(316.673415 167.482397)">training mean, ridge, structured fixed-mode</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(317.280915 174.982397)">six-cell NRMSE · camp-bootstrap · ablations</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(310.715134 182.482397)">nested training camps · 3 same-generator roots</text>
   </g>
  </g>
