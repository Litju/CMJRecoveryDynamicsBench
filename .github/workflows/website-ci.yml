name: Website CI

on:
  push:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      - ".gitignore"
      - "README.rst"
      - "tests/test_architecture.py"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
      - ".gitignore"
      - "README.rst"
      - "tests/test_architecture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local inference runtime
        working-directory: .
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[inference]'
      - name: Exercise local research lab in browser
        working-directory: .
        run: |
          GATE7_LAB_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export GATE7_LAB_TOKEN
          export LAB_LIVE_TOKEN="$GATE7_LAB_TOKEN"
          python tests/research_lab_service.py > "$RUNNER_TEMP/lab-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail -H "X-Lab-Token: $GATE7_LAB_TOKEN" http://127.0.0.1:8765/v1/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          website/node_modules/.bin/playwright test --config website/research-lab/playwright.config.cjs
