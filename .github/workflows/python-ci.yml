name: Python CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and verification tools
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install '.[dev,inference]' build
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright --pythonpath "$(command -v python)"
      - run: pytest
      - run: python -m build
      - name: Installed wheel projection smoke outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cp tests/test_gate7_projection.py tests/test_public_observation_builder.py tests/test_checkpoint_inference.py tests/test_checkpoint_sequence_inference.py tests/test_checkpoint_horizon_inference.py tests/test_checkpoint_m6_inference.py tests/test_checkpoint_all_loaders.py tests/test_checkpoint_m7_inference.py tests/test_checkpoint_m8_inference.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -m pytest -q test_gate7_projection.py test_public_observation_builder.py test_checkpoint_inference.py test_checkpoint_sequence_inference.py test_checkpoint_horizon_inference.py test_checkpoint_m6_inference.py test_checkpoint_all_loaders.py test_checkpoint_m7_inference.py test_checkpoint_m8_inference.py
          python -m cmj_recovery_dynamics.observations.public_builder
